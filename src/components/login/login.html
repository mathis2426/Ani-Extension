<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Ani-bankai, votre site d'anime multi-fonctions">
  <title>Ani-bankai - Connexion</title>
  
  <link rel="stylesheet" href="login.css">
  
  <!-- Login script -->
  <script type="module" src="login.js" defer></script>
</head>

<body>
  <!-- Video background -->
  <video class="background-video" id="background-video" autoplay muted loop></video>

  <!-- Error notification -->
  <div class="error" id="error">
    <div class="error__icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" viewBox="0 0 24 24" height="24" fill="none">
        <path fill="#393a37"
          d="m13 13h-2v-6h2zm0 4h-2v-2h2zm-1-15c-1.3132 0-2.61358.25866-3.82683.7612-1.21326.50255-2.31565 1.23915-3.24424 2.16773-1.87536 1.87537-2.92893 4.41891-2.92893 7.07107 0 2.6522 1.05357 5.1957 2.92893 7.0711.92859.9286 2.03098 1.6651 3.24424 2.1677 1.21325.5025 2.51363.7612 3.82683.7612 2.6522 0 5.1957-1.0536 7.0711-2.9289 1.8753-1.8754 2.9289-4.4189 2.9289-7.0711 0-1.3132-.2587-2.61358-.7612-3.82683-.5026-1.21326-1.2391-2.31565-2.1677-3.24424-.9286-.92858-2.031-1.66518-3.2443-2.16773-1.2132-.50254-2.5136-.7612-3.8268-.7612z">
        </path>
      </svg>
    </div>
    <div class="error__title" id="error__title"></div>
    <div class="error__close" id="error__close">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" viewBox="0 0 20 20" height="20">
        <path fill="#393a37"
          d="m15.8333 5.34166-1.175-1.175-4.6583 4.65834-4.65833-4.65834-1.175 1.175 4.65833 4.65834-4.65833 4.6583 1.175 1.175 4.65833-4.6583 4.6583 4.6583 1.175-1.175-4.6583-4.6583z">
        </path>
      </svg>
    </div>
  </div>

  <!-- Login form -->
  <form id="login-form">
    <h1>Se connecter</h1>
    
    <p class="choose-email">Veuillez entrer vos identifiants :</p>
    
    <div class="inputs">
      <input id="email" type="email" placeholder="Email" required>
      <input id="password" type="password" placeholder="Mot de passe" required>
    </div>
    
    <p class="inscription">Je n'ai pas de compte? Je m'en <span><a class="deco_cree" href="account_creation">crée</a></span> un.</p>
    
    <div align="center">
      <button type="submit">Se connecter</button>
    </div>
  </form>

</body>

</html>
