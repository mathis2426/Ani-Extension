<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="stylesheet" href="settings.css">
    <script type="module" src="settings.js"></script>
    <title>AniExtension: Settings</title>
</head>

<body>
    <div class="nav-bar">
        <div class="logo">Ani-Extension</div>
        <div class="menu">
            <div class="title">Menu</div>
            <div class="buttons">
                <button class="button" id="home">
                    <div class="selector"></div>
                    <div class="icon"></div>
                    <div class="name">Home</div>
                </button>
                <button class="button" id="generalSettings">
                    <div class="selector"></div>
                    <div class="icon"></div>
                    <div class="name">General Settings</div>
                </button>
                <button class="button" id="crunchyroll">
                    <div class="selector"></div>
                    <div class="icon"></div>
                    <div class="name">Crunchyroll</div>
                </button>
                <button class="button" id="voiranime">
                    <div class="selector"></div>
                    <div class="icon"></div>
                    <div class="name">VoirAnime</div>
                </button>
                <button class="button" id="calendar">
                    <div class="selector"></div>
                    <div class="icon"></div>
                    <div class="name">Calendar</div>
                </button>
                <button class="button" id="openSubtitles">
                    <div class="selector"></div>
                    <div class="icon"></div>
                    <div class="name">OpenSubtitles</div>
                </button>
                <button class="button" id="tmdb">
                    <div class="selector"></div>
                    <div class="icon"></div>
                    <div class="name">TMDb</div>
                </button>
            </div>
        </div>
    </div>
    <div class="content" id="content">
        <div id="section-home" class="section">
            <h1>Welcome to Ani-Extension Settings</h1>
            <p>Select a category from the menu to begin configuring your extension.</p>
        </div>
        <!-- GENERAL SETTINGS -->
        <div id="section-generalSettings" class="section">
            <div class="section-title">Global Settings</div>


            <form class="choices">
                <fieldset>
                    <input type="radio" name="style" id="style-default" value="default" checked>
                    <label class="card" for="style-default">
                        <img class="thumb" src="../../../public/images-extension/Skeleton-extension-classic.png"
                            alt="Aperçu Default">
                        <span class="title">Default</span>
                        <span class="subtitle">Default black & white</span>

                        <span class="check" aria-hidden="true">✓</span>
                    </label>

                    <input type="radio" name="style" id="style-simplified" value="simplified">
                    <label class="card" for="style-simplified">
                        <img class="thumb" src="" alt="Aperçu Simplified">

                        <span class="title">Simplified</span>
                        <span class="subtitle">Minimal and modern.</span>

                        <span class="check" aria-hidden="true">✓</span>
                    </label>
                </fieldset>
            </form>




            <label class="block">
                Enable white theme
                <label class="switch">
                    <input type="checkbox" id="darkMode">
                    <span class="slider"></span>
                </label>
            </label><br>
            <label class="chrome-notifications">
                <button class="classic-btn" id="notifications-extension">
                    Enable chrome notifications </button>
                <p id="notifications-status"></p>
            </label><br>
            <label>
                <input type="checkbox" id="notifications-mail">
                Enable mail notifications for future releases <div class="tooltip-not-implemented">Feature not
                    implemented yet</div>
            </label>
        </div>

        <!-- CRUNCHYROLL -->
        <div id="section-crunchyroll" class="section">
            <div class="section-title">Crunchyroll Settings</div>
            <label>
                <input type="checkbox" id="skipIntroOutro">
                Auto-skip intro/outro <div class="tooltip-not-implemented">Feature not implemented yet</div>
            </label><br>
            <label>
                <input type="checkbox" id="autoNext">
                Auto next episode <div class="tooltip-not-implemented">Feature not implemented yet</div>
            </label>
        </div>

        <!-- VOIRANIME -->
        <div id="section-voiranime" class="section">
            <div class="section-title">VoirAnime Settings</div>
            <label>
                <input type="checkbox" id="voiranimeSkipIntro">
                Auto-skip intro/outro <div class="tooltip-not-implemented">Feature not implemented yet</div>
            </label><br>
            <label>
                <input type="checkbox" id="voiranimeAutoNext">
                Auto next episode <div class="tooltip-not-implemented">Feature not implemented yet</div>
            </label>
        </div>

        <!-- CALENDAR -->
        <div id="section-calendar" class="section">
            <div class="section-title">Planning Integration</div>
            <label>
                <input type="checkbox" id="syncGoogleCalendar">
                Sync planning with Google Calendar <div class="tooltip-not-implemented">Feature not implemented yet
                </div>
            </label><br>
            <label>
                <input type="text" placeholder="Google Calendar API Key" id="calendarApiKey">
                <div class="tooltip-not-implemented">Feature not implemented yet</div>
            </label>
        </div>

        <!-- OPEN SUBTITLES -->
        <div id="section-openSubtitles" class="section">
            <div class="section-title">OpenSubtitles Settings</div>
            <div class="open-subtitles-block">
                    <p id="openSubtitlesStatus"></p>
                    <!-- Language selector for OpenSubtitles (used for subtitle searches) -->
                    <label class="block">
                        <span>Preferred subtitle language</span>
                            <div class="language-control">
                                <img id="openSubtitlesLanguageFlag" class="language-flag" src="" alt="flag">
                                <select id="openSubtitlesLanguage" class="language-select">
                                    <option value="fr">Français</option>
                                    <option value="en">English</option>
                                    <option value="es">Español</option>
                                    <option value="de">Deutsch</option>
                                    <option value="it">Italiano</option>
                                    <option value="ja">日本語</option>
                                    <option value="pt">Português</option>
                                    <option value="ru">Русский</option>
                                </select>
                            </div>
                    </label>
                <label>
                    <input type="text" placeholder="Username" id="openSubtitlesEmail">
                </label>
                <label>
                    <input type="password" placeholder="Password" id="openSubtitlesPassword">
                </label>
                
                <div class="actions">
                    <button id="openSubtitlesConnect" class="classic-btn">Login</button>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
