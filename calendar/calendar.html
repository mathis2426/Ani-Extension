<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="calendar.css" />
  <script type="module" src="main.js"></script>
  <title>Ani-Extension</title>
</head>

<body>
  <div class="loading-screen" id="loading-screen">
    <div class="loader"></div>
    <p>Chargement...</p>
  </div>

  <div id="main-content" class="main-content">
    <div class="navigation">
      <button class="button inactive" id="prev-week">Semaine précédente</button>

      <div id="sort-dropdown"></div>

      <div id="week-label"></div>

      <div id="filter-dropdown"></div>

      <button class="button" id="next-week">Semaine suivante</button>
    </div>

    <div class="tabs">
      <button class="tab-btn active" id="tab-anime">Calendrier Anime</button>
      <button class="tab-btn" id="tab-personal">Calendrier Personnel</button>
    </div>

    
    <div class="tab-content" id="tab-content">
      <div class="content" id="anime-content" style="display: flex;">
        <div class="hours"></div>
        <div class="schedule-grid" id="schedule"></div>
      </div>

      <div class="content" id="personal-content" style="display: none;">
        <div class="hours"></div>
        <div class="schedule-grid" id="schedule-personal"></div>
      </div>
    </div>
  </div>
</body>
</html>
